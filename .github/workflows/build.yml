
name: Build GestaltEdit IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project GestaltEdit.xcodeproj \
            -scheme GestaltEdit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GestaltEdit.app Payload/
          /usr/bin/zip -qr GestaltEdit.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GestaltEdit-IPA
          path: GestaltEdit.ipa
          if-no-files-found: error
